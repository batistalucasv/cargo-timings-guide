<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-label="Storage Throughput vs Controlled Warm Nextest Loop">
  <rect width="980" height="330" rx="14" fill="#0d1117" stroke="#30363d"/>
  <line x1="470" y1="24" x2="470" y2="306" stroke="#21262d" stroke-width="1.5"/>
  <text x="28" y="42" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">Measured Storage Throughput</text>
  <text x="28" y="62" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11.5">Sequential Write / Direct Read (MB/s · Higher is better)</text>
  <text x="498" y="42" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">Controlled Warm Test Loop (app-ui)</text>
  <text x="498" y="62" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11.5">Same target &amp; test filter (seconds · Lower is better)</text>
  <text x="28" y="92" fill="#e6edf3" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">SATA SSD (target + sccache)</text>
  <rect x="28" y="102" width="302.0" height="15" rx="3.5" fill="#38bdf8" fill-opacity="0.75"/>
  <text x="338.0" y="114" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11.5">W 421 MB/s</text>
  <rect x="28" y="121" width="310.6" height="15" rx="3.5" fill="#38bdf8"/>
  <text x="346.6" y="133" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">R 433 MB/s</text>
  <text x="28" y="162" fill="#e6edf3" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">HDD #1 (workspace repos)</text>
  <rect x="28" y="172" width="65.3" height="15" rx="3.5" fill="#64748b" fill-opacity="0.75"/>
  <text x="101.3" y="184" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11.5">W 91 MB/s</text>
  <rect x="28" y="191" width="81.1" height="15" rx="3.5" fill="#64748b"/>
  <text x="117.1" y="203" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">R 113 MB/s</text>
  <text x="28" y="232" fill="#e6edf3" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">HDD #2 (old sccache + reg)</text>
  <rect x="28" y="242" width="62.4" height="15" rx="3.5" fill="#475569" fill-opacity="0.75"/>
  <text x="98.4" y="254" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11.5">W 87 MB/s</text>
  <rect x="28" y="261" width="66.7" height="15" rx="3.5" fill="#475569"/>
  <text x="102.7" y="273" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">R 93 MB/s</text>
  <text x="498" y="100" fill="#e6edf3" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600">mold + sccache SSD</text>
  <rect x="498" y="106" width="103.7" height="14" rx="3.5" fill="#10b981"/>
  <text x="609.7" y="117.5" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="12" font-weight="700">7.83s</text>
  <text x="952" y="117" text-anchor="end" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11">WINNER</text>
  <text x="498" y="144" fill="#e6edf3" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600">mold + /dev/shm (RAM)</text>
  <rect x="498" y="150" width="106.1" height="14" rx="3.5" fill="#38bdf8"/>
  <text x="612.1" y="161.5" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="12" font-weight="700">8.01s</text>
  <text x="952" y="161" text-anchor="end" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11">Eats RAM</text>
  <text x="498" y="188" fill="#e6edf3" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600">wild linker + HDD</text>
  <rect x="498" y="194" width="132.2" height="14" rx="3.5" fill="#a78bfa"/>
  <text x="638.2" y="205.5" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="12" font-weight="700">9.98s</text>
  <text x="952" y="205" text-anchor="end" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11">clippy fail</text>
  <text x="498" y="232" fill="#e6edf3" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600">mold + sccache HDD</text>
  <rect x="498" y="238" width="167.5" height="14" rx="3.5" fill="#f59e0b"/>
  <text x="673.5" y="249.5" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="12" font-weight="700">12.64s</text>
  <text x="952" y="249" text-anchor="end" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11">HDD I/O</text>
  <text x="498" y="276" fill="#e6edf3" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600">mold + no sccache</text>
  <rect x="498" y="282" width="236.4" height="14" rx="3.5" fill="#ef4444"/>
  <text x="742.4" y="293.5" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="12" font-weight="700">17.84s</text>
  <text x="952" y="293" text-anchor="end" fill="#8b949e" font-family="ui-monospace, monospace" font-size="11">No cache</text>
</svg>
